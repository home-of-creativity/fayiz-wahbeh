    <script>
      // Apply the stored language direction before first paint to avoid a layout flip.
      try {
        var stored = localStorage.getItem('fw-lang');
        if (stored && stored.indexOf('ar') === 0) {
          document.documentElement.lang = 'ar';
          document.documentElement.dir = 'rtl';
        }
      } catch (e) {}
    </script>
